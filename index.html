<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Alquileres</title>
  <!-- Anti-flash: aplica el tema guardado ANTES de pintar (clave igual a core/tema.js) -->
  <script>(function(){try{if(localStorage.getItem('alquileres_tema')==='oscuro')document.documentElement.setAttribute('data-tema','oscuro');}catch(e){}})();</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="assets/styles/tokens.css" />
  <link rel="stylesheet" href="assets/styles/styles.css" />
  <link rel="stylesheet" href="assets/styles/notificaciones.css" />

  <!-- Import map: resuelve los módulos de Firebase desde el CDN -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
    }
  }
  </script>

</head>
<body>
  <div id="cargando-inicial" class="cargando-inicial">Cargando…</div>

  <div id="app" hidden>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="marca">
        <div class="marca__logo" id="marca-inicial">A</div>
        <div class="marca__nombre" id="marca-nombre">Alquileres</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar__pie">
        <div class="user">
          <div class="user__email" id="user-email"></div>
          <div class="user__acciones">
            <button class="btn btn--ghost btn--sm" id="btn-tema" type="button" title="Cambiar tema">🌙</button>
            <button class="btn btn--ghost btn--sm" id="btn-logout">Salir</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Contenido -->
    <div class="main">
      <header class="topbar">
        <button class="btn-menu" id="btn-menu" aria-label="Menú">☰</button>
        <span class="topbar__titulo" id="marca-nombre-top"></span>
        <div class="topbar__busqueda" id="topbar-busqueda"></div>
      </header>
      <main class="contenido" id="app-content"></main>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
